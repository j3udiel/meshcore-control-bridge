name: MeshCore Control Bridge
slug: meshcore_control_bridge
description: Offline command bridge between MeshCore and Home Assistant
version: "0.1.22"
startup: application
boot: auto
init: false
homeassistant_api: true
stage: experimental
image: "ghcr.io/j3udiel/meshcore-control-bridge"
arch:
  - amd64
  - aarch64
options:
  channel_index: 1
  meshcore_entry_id: ""
  command_prefix: "!"
  authorized_senders: []
  status_entities: []
  weather_status:
    temperature_entity: ""
    humidity_entity: ""
    label: "Exterior"
  home_status:
    alarm:
      entity_id: ""
      door_entities: []
      motion_entities: []
    home:
      person_entities: []
      presence_entities: []
      door_entities: []
      light_entities: []
      temperature_entity: ""
      humidity_entity: ""
      ups_battery_entity: ""
    servers:
      entries: []
    network:
      internet_entity: ""
      router_entity: ""
      dns_entity: ""
      home_assistant_entity: ""
      additional_entities: []
  telegram:
    enabled: false
    bot_token_import: ""
    bot_token_file: /data/telegram.bot_token
    allowed_private_chat_id: ""
    allowed_user_id: ""
    authorized_user_role: readonly
    meshcore_channel_index: 1
    forward_meshcore_to_telegram: true
    forward_telegram_to_meshcore: true
    command_prefix: "!"
    max_meshcore_message_length: 180
    max_telegram_message_length: 3900
    message_prefix: "TG: "
    meshcore_to_telegram_prefix: "MC: "
    send_forward_confirmation: false
    forwarding_rate_limit:
      messages: 5
      window_seconds: 60
    inbound_forwarding_rate_limit:
      messages: 20
      window_seconds: 60
  health:
    home_assistant_events_enabled: true
    heartbeat_seconds: 60
  rate_limit:
    commands: 5
    window_seconds: 60
  log_level: debug
  allow_unidentified_readonly_testing: true
schema:
  channel_index: "int(1,255)"
  meshcore_entry_id: "str?"
  command_prefix: "str(1,4)"
  authorized_senders:
    - pubkey_prefix: "str(6,128)"
      name: "str"
      role: "list(readonly|home|operator|admin)"
  status_entities:
    - alias: "match(^[A-Za-z0-9_-]+$)"
      entity_id: "str"
      label: "str"
  weather_status:
    temperature_entity: "str?"
    humidity_entity: "str?"
    label: "str"
  home_status:
    alarm:
      entity_id: "str?"
      door_entities:
        - "str"
      motion_entities:
        - "str"
    home:
      person_entities:
        - "str"
      presence_entities:
        - "str"
      door_entities:
        - "str"
      light_entities:
        - "str"
      temperature_entity: "str?"
      humidity_entity: "str?"
      ups_battery_entity: "str?"
    servers:
      entries:
        - alias: "match(^[a-z0-9_-]{1,32}$)"
          name: "str"
          availability_entity: "str?"
          cpu_entity: "str?"
          memory_entity: "str?"
          disk_entity: "str?"
          temperature_entity: "str?"
          health_entity: "str?"
    network:
      internet_entity: "str?"
      router_entity: "str?"
      dns_entity: "str?"
      home_assistant_entity: "str?"
      additional_entities:
        - "str"
  telegram:
    enabled: bool
    bot_token_import: "password?"
    bot_token_file: "str?"
    allowed_private_chat_id: "str?"
    allowed_user_id: "str?"
    authorized_user_role: "list(readonly|home|operator|admin)"
    meshcore_channel_index: "int(1,255)"
    forward_meshcore_to_telegram: bool
    forward_telegram_to_meshcore: bool
    command_prefix: "str(1,4)"
    max_meshcore_message_length: "int(1,1000)"
    max_telegram_message_length: "int(1,4096)"
    message_prefix: "str?"
    meshcore_to_telegram_prefix: "str?"
    send_forward_confirmation: bool
    forwarding_rate_limit:
      messages: "int(1,100)"
      window_seconds: "int(1,3600)"
    inbound_forwarding_rate_limit:
      messages: "int(1,100)"
      window_seconds: "int(1,3600)"
  health:
    home_assistant_events_enabled: bool
    heartbeat_seconds: "int(15,3600)"
  rate_limit:
    commands: "int(1,100)"
    window_seconds: "int(1,3600)"
  log_level: "list(debug|info|warning|error)"
  allow_unidentified_readonly_testing: bool
