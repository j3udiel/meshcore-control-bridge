name: MeshCore Control Bridge
slug: meshcore_control_bridge
description: Offline command bridge between MeshCore and Home Assistant
version: "0.1.10"
startup: application
boot: auto
init: false
homeassistant_api: true
stage: experimental
image: "ghcr.io/j3udiel/meshcore-control-bridge"
arch:
  - amd64
  - aarch64
options:
  channel_index: 1
  meshcore_entry_id: ""
  command_prefix: "!"
  authorized_senders: []
  status_entities: []
  weather_status:
    temperature_entity: ""
    humidity_entity: ""
    label: "Exterior"
  telegram:
    enabled: false
    bot_token_import: ""
    bot_token_file: /data/telegram.bot_token
    allowed_private_chat_id: ""
    allowed_user_id: ""
    meshcore_channel_index: 1
    forward_meshcore_to_telegram: true
    forward_telegram_to_meshcore: true
    command_prefix: "!"
    max_meshcore_message_length: 180
    message_prefix: "TG: "
    forwarding_rate_limit:
      messages: 5
      window_seconds: 60
  rate_limit:
    commands: 5
    window_seconds: 60
  log_level: debug
  allow_unidentified_readonly_testing: true
schema:
  channel_index: "int(1,255)"
  meshcore_entry_id: "str?"
  command_prefix: "str(1,4)"
  authorized_senders:
    - pubkey_prefix: "str(6,128)"
      name: "str"
      role: "list(readonly|home|operator|admin)"
  status_entities:
    - alias: "match(^[A-Za-z0-9_-]+$)"
      entity_id: "str"
      label: "str"
  weather_status:
    temperature_entity: "str?"
    humidity_entity: "str?"
    label: "str"
  telegram:
    enabled: bool
    bot_token_import: "password?"
    bot_token_file: "str?"
    allowed_private_chat_id: "str?"
    allowed_user_id: "str?"
    meshcore_channel_index: "int(1,255)"
    forward_meshcore_to_telegram: bool
    forward_telegram_to_meshcore: bool
    command_prefix: "str(1,4)"
    max_meshcore_message_length: "int(1,1000)"
    message_prefix: "str?"
    forwarding_rate_limit:
      messages: "int(1,100)"
      window_seconds: "int(1,3600)"
  rate_limit:
    commands: "int(1,100)"
    window_seconds: "int(1,3600)"
  log_level: "list(debug|info|warning|error)"
  allow_unidentified_readonly_testing: bool
