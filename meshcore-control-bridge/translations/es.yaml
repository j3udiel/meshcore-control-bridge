configuration:
  channel_index:
    name: Indice de canal
    description: Indice del canal privado MeshCore. El canal publico 0 no esta permitido.
  meshcore_entry_id:
    name: ID de entrada MeshCore
    description: ID opcional de meshcore-ha cuando hay varias entradas configuradas.
  authorized_senders:
    name: Remitentes autorizados
    description: Prefijos de clave publica MeshCore autorizados para ejecutar comandos.
  weather_status:
    name: Estado exterior
    description: Entidades readonly opcionales de Home Assistant usadas por !exterior.
  telegram:
    name: Telegram
    description: Soporte Telegram Bot API desactivado por defecto para comandos readonly y reenvio opcional de texto normal con MeshCore.
    fields:
      send_forward_confirmation:
        name: Confirmar mensajes reenviados
        description: Envia una confirmacion en Telegram despues de reenviar correctamente un mensaje a MeshCore.
  health:
    name: Salud del bridge
    description: Eventos readonly de salud del bridge para sensores template de Home Assistant.
    fields:
      home_assistant_events_enabled:
        name: Eventos de salud en Home Assistant
        description: Publica snapshots redactados de salud del bridge como eventos de Home Assistant.
      heartbeat_seconds:
        name: Segundos de heartbeat de salud
        description: Publica un evento periodico de salud aunque el estado del bridge no haya cambiado.
