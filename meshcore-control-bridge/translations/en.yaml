configuration:
  channel_index:
    name: Channel index
    description: Private MeshCore channel index. Public channel 0 is not allowed.
  meshcore_entry_id:
    name: MeshCore entry ID
    description: Optional meshcore-ha config entry ID when multiple entries exist.
  authorized_senders:
    name: Authorized senders
    description: Stable MeshCore public-key prefixes allowed to execute commands.
  weather_status:
    name: Outdoor status
    description: Optional read-only Home Assistant entities used by !exterior.
  home_status:
    name: Home status
    description: Allowlisted read-only Home Assistant entities used by !alarma, !casa, !servers and !red.
  telegram:
    name: Telegram
    description: Disabled-by-default Telegram Bot API support for readonly commands and optional normal-text forwarding with MeshCore.
    fields:
      authorized_user_role:
        name: Telegram user role
        description: Role assigned to the authorized private Telegram user. Defaults to readonly; admin enables temporary controls.
      send_forward_confirmation:
        name: Confirm forwarded messages
        description: Send a Telegram confirmation after successfully forwarding a message to MeshCore.
  health:
    name: Bridge health
    description: Read-only bridge health events for Home Assistant template sensors.
    fields:
      home_assistant_events_enabled:
        name: Home Assistant health events
        description: Publish redacted bridge health snapshots as Home Assistant events.
      heartbeat_seconds:
        name: Health heartbeat seconds
        description: Publish a periodic health event even when the bridge state has not changed.
