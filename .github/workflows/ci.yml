name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Secret check
        run: bash scripts/check-secrets.sh

      - name: Home Assistant App check
        run: bash scripts/check-home-assistant-app.sh

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

      - name: Tests
        run: python -m pytest

  app-image:
    name: Home Assistant App image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build App image
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.1.9 \
            -f meshcore-control-bridge/Dockerfile \
            -t meshcore-control-bridge-ha-app:test \
            .

      - name: Check built image
        run: bash scripts/check-built-image.sh meshcore-control-bridge-ha-app:test
