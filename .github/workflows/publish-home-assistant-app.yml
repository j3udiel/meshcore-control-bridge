name: Publish Home Assistant App image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image/app version to publish, for example 0.1.13
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: meshcore-control-bridge

jobs:
  init:
    name: Prepare build matrix
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${REF_NAME#v}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: meshcore-control-bridge/Dockerfile
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
          labels: |
            org.opencontainers.image.title=MeshCore Control Bridge
            org.opencontainers.image.description=Offline command bridge between MeshCore and Home Assistant
            org.opencontainers.image.licenses=Apache-2.0
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - init
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}

  release:
    name: Create GitHub Release
    needs:
      - init
      - manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag is on main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "${TAG_NAME}")"
          main_commit="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${tag_commit}" "${main_commit}"; then
            echo "Tag ${TAG_NAME} does not point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Resolve published image digest
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '/^Digest:/ {print $2; exit}')"
          if [[ -z "${digest}" ]]; then
            echo "Could not resolve published image digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build release notes
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          python3 scripts/build_release_notes.py \
            --version "${VERSION}" \
            --image "${IMAGE}" \
            --digest "${DIGEST}" \
            --output /tmp/release-notes.md

      - name: Resolve release type
        id: release
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.init.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          python3 scripts/upsert_github_release.py \
            --tag "${TAG_NAME}" \
            --title "MeshCore Control Bridge ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --prerelease "${PRERELEASE}"
