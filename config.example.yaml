command_prefix: "!"
database_path: "data/audit.db"
deduplication_window_seconds: 300
audit_retention_days: 30

meshcore:
  # Do not use channel 0/Public for administrative commands.
  channel_index: 1
  serial_port: null
  baudrate: 115200

homeassistant:
  # Prefer a local URL so the bridge works when Internet or public DNS is down.
  base_url: http://homeassistant.local:8123
  # Prefer HA_TOKEN in the environment. Do not commit real tokens.
  token: ""
  verify_tls: true
  timeout_seconds: 5

weather_status:
  # Leave empty to make !exterior report that it is not configured.
  # Configure only read-only Home Assistant entity IDs controlled by the operator.
  temperature_entity: ""
  humidity_entity: ""
  label: "Exterior"

telegram:
  enabled: false
  # Use a protected file for the real bot token. Do not commit the token.
  bot_token_import: ""
  bot_token_file: /data/telegram.bot_token
  allowed_private_chat_id: ""
  allowed_user_id: ""
  meshcore_channel_index: 1
  forward_meshcore_to_telegram: true
  forward_telegram_to_meshcore: true
  command_prefix: "!"
  max_meshcore_message_length: 180
  message_prefix: ""

users:
  # Use a stable public key or node ID. Do not trust display names as authentication.
  "meshcore-public-key-or-stable-node-id":
    name: "admin-device"
    role: "admin"

entities:
  all: {}
  lights:
    salon: "light.salon"
    cocina: "light.cocina"
    despacho: "light.despacho"

servers: {}
