# Safe example only. Do not commit a real config.yaml.
command_prefix: "!"
database_path: "data/audit.db"
deduplication_window_seconds: 300
audit_retention_days: 30

meshcore:
  # Channel 0/Public must not be used for administration.
  transport: placeholder
  channel_index: 1
  # Set to a stable /dev/serial/by-id/... path when testing USB.
  serial_port: null
  baudrate: 115200
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  protocol_version: auto

homeassistant:
  base_url: http://homeassistant.local:8123
  # Prefer HA_TOKEN in the environment.
  token: ""
  verify_tls: true
  timeout_seconds: 5

users:
  "meshcore-public-key-or-stable-node-id":
    name: "admin-device"
    role: "admin"

status:
  entities:
    temperature:
      entity_id: sensor.living_room_temperature
      label: Temp

security:
  rate_limit:
    commands: 5
    window_seconds: 60
