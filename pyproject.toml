[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-control-bridge"
version = "0.1.7"
description = "Local out-of-band command bridge for Home Assistant over MeshCore"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jeudiel Guerrero" },
]
keywords = [
  "meshcore",
  "lora",
  "home-assistant",
  "offline",
  "out-of-band",
  "self-hosted",
  "automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pyserial>=3.5",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.9",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
meshcore-control-bridge = "meshcore_control.main:main"
meshcore-diagnose = "meshcore_control.diagnostics.meshcore:main"

[project.urls]
Repository = "https://github.com/j3udiel/meshcore-control-bridge"
Issues = "https://github.com/j3udiel/meshcore-control-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["httpx", "serial", "serial.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["websockets"]
ignore_missing_imports = true
